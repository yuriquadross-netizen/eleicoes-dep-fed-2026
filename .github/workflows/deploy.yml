# Publica o app no GitHub Pages.
# Gera os JSON a partir de data/processed/ (versionado) e faz o build do web/.
# Pré-requisito único: Settings › Pages › Source = "GitHub Actions".
name: Publicar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow
      - name: Exportar JSON (2026, Brasil)
        run: python pipeline/exportar_web.py --ano 2026 --uf BR
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # O site tem ~14 mil arquivos; o Pages às vezes passa de 10 min (padrão) processando.
          timeout: 1800000
